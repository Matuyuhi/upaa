name: test

on:
  push:
    branches: [main]
  pull_request:
  # bump-version.yml runs it on its version commit, which must pass before it goes to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Check that the actions still use the commits pinned in actions.lock.
  # When adding or upgrading an action, run gh actions-lock locally and commit the lockfile.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify

  test:
    # Snapshots are compared, so the macOS version is pinned to keep font rendering the same (xcode-27 is macOS 27).
    # When upgrading, look at the failing comparison images before regenerating the baselines (tests/snapshots/).
    runs-on: xcode-27
    env:
      # The image default is Xcode 27.1. Use 27.2, the same as local.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Do not fetch again unless the fetch script (which pins the version and SHA-256) changes.
      - name: libghostty-vt cache
        id: ghostty-vt
        uses: actions/cache@v6.1.0
        with:
          path: vendor/ghostty-vt
          key: ghostty-vt-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      # Intermediate outputs of Zig and SwiftPM. Rebuilt only for the parts whose sources changed.
      - name: Build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            .build
          key: build-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'Package.swift', 'core/**', 'Sources/**') }}
          restore-keys: build-${{ runner.os }}-

      - name: Install Zig
        run: |
          brew install zig
          # libghostty-vt 1.0.x and build.zig assume Zig 0.17.x.
          zig version | grep -q '^0\.17\.' || { echo "Zig 0.17.x is required: $(zig version)"; exit 1; }

      - name: Install Metal Toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Fetch libghostty-vt
        if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: |
          brew install minisign
          sh scripts/fetch-ghostty-vt.sh

      - name: Test
        run: sh scripts/test.sh

      # Open the real window and photograph it, without and with a config file.
      # Only a launch failure, a crash or a missing window fails here; the pictures are kept to look at, not compared.
      - name: Launch screenshots
        env:
          UPAA_NO_UPDATE_CHECK: "1"
        run: |
          dir=build/screenshots
          mkdir -p "$dir/default/upaa" "$dir/config/upaa"
          printf '%s\n' 'font-size = 16' 'foreground = #cdd6f4' 'background = #1e1e2e' 'window-width = 100' > "$dir/config/upaa/config"
          # Prints the id of the window owned by the given process, to photograph that window alone.
          cat > "$dir/window.swift" <<'SWIFT'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] ?? []
          if let id = windows.first(where: { $0["kCGWindowOwnerPID"] as? Int == pid && $0["kCGWindowLayer"] as? Int == 0 })?["kCGWindowNumber"] {
              print(id)
          }
          SWIFT
          for name in default config top dark; do
            # top: no config file, with the tab list hidden (Cmd-B), so the tabs are in the toolbar, and a second tab opened there (Cmd-T).
            # dark: no config file, with the runner switched to dark mode.
            conf="$name"
            [ "$name" = top ] && conf=default
            if [ "$name" = dark ]; then
              conf=default
              osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
            fi
            # Each launch starts at the config's size, not where the last one left its window.
            defaults delete local.upaa 2>/dev/null || true
            XDG_CONFIG_HOME="$PWD/$dir/$conf" build/upaa.app/Contents/MacOS/upaa &
            pid=$!
            sleep 5
            kill -0 "$pid" || { echo "upaa exited during launch ($name)"; exit 1; }
            if [ "$name" = top ]; then
              osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" \
                -e 'tell application "System Events" to keystroke "b" using command down' \
                -e 'delay 1' \
                -e 'tell application "System Events" to keystroke "t" using command down' || echo "could not press Cmd-B, Cmd-T"
              sleep 2
            fi
            id="$(swift "$dir/window.swift" "$pid")"
            [ -n "$id" ] || { echo "upaa opened no window ($name)"; exit 1; }
            screencapture -x -o -l "$id" "$dir/$name.png"
            sips -g pixelWidth -g pixelHeight "$dir/$name.png"; wc -c "$dir/$name.png"
            kill "$pid"
            wait "$pid" || true
          done

      - name: Keep the launch screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: launch-screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore

      - name: Keep the exported screens
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshots
          path: build/snapshots

  # Show the launch screenshots on the pull request, in one comment edited on each push.
  # gh pr comment --attach refuses the workflow token, so the pictures go on the ci-screenshots branch,
  # which holds one commit with the latest pictures of each pull request, and the comment links to them.
  # A separate job, so the job that builds and runs the pull request's code keeps a read-only token.
  # A pull request from a fork never gets write access, so it is skipped there.
  screenshots-comment:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Post the launch screenshots
        run: |
          gh run download "$GITHUB_RUN_ID" --name launch-screenshots --dir shots
          git init -q store
          cd store
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git"
          if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q FETCH_HEAD; fi
          # A new commit with no parent each time, so old pictures do not pile up in the history.
          git checkout -q --orphan next
          rm -rf "pr-$PR"
          mkdir -p "pr-$PR/$SHA"
          cp ../shots/*.png "pr-$PR/$SHA/"
          git add -A
          git commit -q -m "Launch screenshots of #$PR at $SHA"
          git push -q --force origin HEAD:ci-screenshots
          url="https://raw.githubusercontent.com/$GH_REPO/ci-screenshots/pr-$PR/$SHA"
          printf '%s\n' "Launch screenshots for $SHA" '' \
            "Without a config file: ![default]($url/default.png)" '' \
            "With a config file: ![config]($url/config.png)" '' \
            "Tabs along the top (Cmd-B): ![top]($url/top.png)" '' \
            "In dark mode: ![dark]($url/dark.png)" > ../comment.md
          gh pr comment "$PR" --edit-last --create-if-none --body-file ../comment.md
