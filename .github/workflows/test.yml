name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Check that the actions still use the commits pinned in actions.lock.
  # When adding or upgrading an action, run gh actions-lock locally and commit the lockfile.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify

  test:
    # Snapshots are compared, so the macOS version is pinned to keep font rendering the same (xcode-27 is macOS 27).
    # When upgrading, look at the failing comparison images before regenerating the baselines (tests/snapshots/).
    runs-on: xcode-27
    env:
      # The image default is Xcode 27.1. Use 27.2, the same as local.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Do not fetch again unless the fetch script (which pins the version and SHA-256) changes.
      - name: libghostty-vt cache
        id: ghostty-vt
        uses: actions/cache@v6.1.0
        with:
          path: vendor/ghostty-vt
          key: ghostty-vt-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      # Intermediate outputs of Zig and SwiftPM. Rebuilt only for the parts whose sources changed.
      - name: Build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            .build
          key: build-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'Package.swift', 'core/**', 'Sources/**') }}
          restore-keys: build-${{ runner.os }}-

      - name: Install Zig
        run: |
          brew install zig
          # libghostty-vt 1.0.x and build.zig assume Zig 0.17.x.
          zig version | grep -q '^0\.17\.' || { echo "Zig 0.17.x is required: $(zig version)"; exit 1; }

      - name: Install Metal Toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Fetch libghostty-vt
        if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: |
          brew install minisign
          sh scripts/fetch-ghostty-vt.sh

      - name: Test
        run: sh scripts/test.sh

      # Open the real window and photograph it, without and with a config file.
      # Only a launch failure, a crash or a missing window fails here; the pictures are kept to look at, not compared.
      - name: Launch screenshots
        env:
          UPAA_NO_UPDATE_CHECK: "1"
        run: |
          dir=build/screenshots
          mkdir -p "$dir/default/upaa" "$dir/config/upaa"
          printf '%s\n' 'font-family = Menlo' 'font-family = Apple Color Emoji' 'font-size = 16' 'foreground = #cdd6f4' 'background = #1e1e2e' 'window-width = 100' > "$dir/config/upaa/config"
          # Prints the id of the window owned by the given process, to photograph that window alone.
          cat > "$dir/window.swift" <<'SWIFT'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] ?? []
          if let id = windows.first(where: { $0["kCGWindowOwnerPID"] as? Int == pid && $0["kCGWindowLayer"] as? Int == 0 })?["kCGWindowNumber"] {
              print(id)
          }
          SWIFT
          for name in default config dark; do
            # dark: no config file, with the runner switched to dark mode.
            conf="$name"
            if [ "$name" = dark ]; then
              conf=default
              osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
            fi
            XDG_CONFIG_HOME="$PWD/$dir/$conf" build/upaa.app/Contents/MacOS/upaa &
            pid=$!
            sleep 5
            kill -0 "$pid" || { echo "upaa exited during launch ($name)"; exit 1; }
            id="$(swift "$dir/window.swift" "$pid")"
            [ -n "$id" ] || { echo "upaa opened no window ($name)"; exit 1; }
            screencapture -x -o -l "$id" "$dir/$name.png"
            sips -g pixelWidth -g pixelHeight "$dir/$name.png"; wc -c "$dir/$name.png"
            kill "$pid"
            wait "$pid" || true
          done

      # The Settings window (Cmd-,), alone, with the config file above. Pressing keys needs the runner to allow it,
      # so a missing picture does not fail here.
      - name: Settings screenshot
        env:
          UPAA_NO_UPDATE_CHECK: "1"
        run: |
          dir=build/screenshots
          XDG_CONFIG_HOME="$PWD/$dir/config" build/upaa.app/Contents/MacOS/upaa &
          pid=$!
          sleep 5
          osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" \
            -e 'tell application "System Events" to keystroke "," using command down' || echo "could not press Cmd-,"
          sleep 2
          id="$(swift "$dir/window.swift" "$pid")"
          [ -z "$id" ] || screencapture -x -o -l "$id" "$dir/settings.png"
          # A line added to the file by hand reaches the open window (the size shows 20).
          printf '%s\n' 'font-size = 20' >> "$dir/config/upaa/config"
          sleep 2
          [ -z "$id" ] || screencapture -x -o -l "$id" "$dir/settings-reload.png"
          kill "$pid"
          wait "$pid" || true

      # TEMPORARY: pictures for the README, taken with a few tabs, a split and the changes panel open. Removed before merging.
      - name: README screenshots (temporary)
        env:
          UPAA_NO_UPDATE_CHECK: "1"
        run: |
          git fetch -q --unshallow origin main:refs/remotes/origin/main || git fetch -q origin main:refs/remotes/origin/main
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false'
          root="$PWD/build/readme"
          mkdir -p "$root/light/upaa" "$root/dark/upaa"
          printf '%s\n' 'font-size = 12' 'window-width = 128' 'window-height = 30' > "$root/light/upaa/config"
          printf '%s\n' 'font-size = 12' 'window-width = 128' 'window-height = 30' 'foreground = #cdd6f4' 'background = #1e1e2e' > "$root/dark/upaa/config"
          # A demo repository under the runner's home, so the paths read ~/upaa.
          git clone -q "$PWD" ~/upaa
          git -C ~/upaa checkout -q --detach "$(git rev-parse origin/main)"
          # Uncommitted edits, so the changes panel has something to show.
          sed -i '' 's/^background_opacity: f64 = 0\.8,/background_opacity: f64 = 0.85,/; s/@as(f64, 0\.8)/@as(f64, 0.85)/' ~/upaa/core/src/Config.zig
          sed -i '' 's/(default 0\.8)/(default 0.85)/; s/background-opacity = 0\.8$/background-opacity = 0.85/' ~/upaa/README.md
          cat > ~/.bash_profile <<'SH'
          export BASH_SILENCE_DEPRECATION_WARNING=1 CLICOLOR=1 LSCOLORS=ExGxFxdaCxDaDahbadacec
          PS1='\[\e[1;34m\]\W\[\e[0m\] \[\e[35m\]❯\[\e[0m\] '
          PROMPT_COMMAND='printf "\e]0;%s\a" "${PWD##*/}"'
          n=$(cat ~/.n 2>/dev/null || echo 0); echo $((n + 1)) > ~/.n
          clear
          # The first pane narrows when the split or the panel opens, so its lines are kept short enough not to wrap then.
          w=$(tput cols)
          colors() {
            printf '日本語の表示と入力にも対応しています\n\n'
            for i in 0 1 2 3 4 5 6 7; do printf '\e[4%sm    \e[0m' "$i"; done; echo
            for i in 0 1 2 3 4 5 6 7; do printf '\e[10%sm    \e[0m' "$i"; done; echo; echo
            for r in 0 1; do
              for i in $(seq 0 $((w - 3))); do
                h=$((i * 6 / (w - 2))); f=$(((i * 6 % (w - 2)) * 255 / (w - 2))); q=$((255 - f))
                case $h in 0) c="255;$f;80";; 1) c="$q;255;80";; 2) c="80;255;$f";; 3) c="80;$q;255";; 4) c="$f;80;255";; *) c="255;80;$q";; esac
                printf '\e[48;2;%sm \e[0m' "$c"
              done; echo
            done
            echo
          }
          case "$UPAA_SHOT-$n" in
            light-0) cd ~/upaa; git log --graph --color --format='%C(yellow)%h%C(reset) %<(34,trunc)%s' -16 ;;
            light-1) cd ~/upaa/Sources ;;
            light-2) cd ~/upaa/Shaders ;;
            light-3) cd ~/upaa/core/src; colors; ls ;;
            dark-0) cd ~/upaa; git status -s; echo; git diff --stat --color; echo; git log --color --format='%C(yellow)%h%C(reset) %<(56,trunc)%s' -8 ;;
            dark-1) cd ~/upaa/Sources ;;
          esac
          SH
          for name in light dark; do
            rm -f ~/.n
            if [ "$name" = dark ]; then osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'; fi
            UPAA_SHOT=$name XDG_CONFIG_HOME="$root/$name" build/upaa.app/Contents/MacOS/upaa &
            pid=$!
            sleep 5
            osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" || true
            sleep 1
            key() { osascript -e "tell application \"System Events\" to keystroke \"$1\" using command down"; sleep 1.5; }
            if [ "$name" = light ]; then
              key t; key t; key 1; key d
            else
              key t; key 1; key j
            fi
            sleep 2
            id="$(swift build/screenshots/window.swift "$pid")"
            screencapture -x -o -l "$id" "build/screenshots/readme-$name.png" || true
            kill "$pid"; wait "$pid" || true
          done
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false'

      - name: Keep the launch screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: launch-screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore

      - name: Keep the exported screens
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshots
          path: build/snapshots

  # Show the launch screenshots on the pull request, in one comment edited on each push.
  # gh pr comment --attach refuses the workflow token, so the pictures go on the ci-screenshots branch,
  # which holds one commit with the latest pictures of each pull request, and the comment links to them.
  # A separate job, so the job that builds and runs the pull request's code keeps a read-only token.
  # A pull request from a fork never gets write access, so it is skipped there.
  screenshots-comment:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Post the launch screenshots
        run: |
          gh run download "$GITHUB_RUN_ID" --name launch-screenshots --dir shots
          git init -q store
          cd store
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git"
          if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q FETCH_HEAD; fi
          # A new commit with no parent each time, so old pictures do not pile up in the history.
          git checkout -q --orphan next
          rm -rf "pr-$PR"
          mkdir -p "pr-$PR/$SHA"
          cp ../shots/*.png "pr-$PR/$SHA/"
          git add -A
          git commit -q -m "Launch screenshots of #$PR at $SHA"
          git push -q --force origin HEAD:ci-screenshots
          url="https://raw.githubusercontent.com/$GH_REPO/ci-screenshots/pr-$PR/$SHA"
          printf '%s\n' "Launch screenshots for $SHA" '' \
            "Without a config file: ![default]($url/default.png)" '' \
            "With a config file: ![config]($url/config.png)" '' \
            "In dark mode: ![dark]($url/dark.png)" > ../comment.md
          if [ -f ../shots/settings.png ]; then printf '\n%s\n' "Settings (Cmd-,): ![settings]($url/settings.png)" >> ../comment.md; fi
          if [ -f ../shots/settings-reload.png ]; then printf '\n%s\n' "Settings after font-size = 20 is added to the file: ![settings-reload]($url/settings-reload.png)" >> ../comment.md; fi
          gh pr comment "$PR" --edit-last --create-if-none --body-file ../comment.md
