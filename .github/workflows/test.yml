name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Check that the actions still use the commits pinned in actions.lock.
  # When adding or upgrading an action, run gh actions-lock locally and commit the lockfile.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify

  test:
    # Snapshots are compared, so the macOS version is pinned to keep font rendering the same (xcode-27 is macOS 27).
    # When upgrading, look at the failing comparison images before regenerating the baselines (tests/snapshots/).
    runs-on: xcode-27
    env:
      # The image default is Xcode 27.1. Use 27.2, the same as local.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Do not fetch again unless the fetch script (which pins the version and SHA-256) changes.
      - name: libghostty-vt cache
        id: ghostty-vt
        uses: actions/cache@v6.1.0
        with:
          path: vendor/ghostty-vt
          key: ghostty-vt-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      # Intermediate outputs of Zig and SwiftPM. Rebuilt only for the parts whose sources changed.
      - name: Build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            .build
          key: build-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'Package.swift', 'core/**', 'Sources/**') }}
          restore-keys: build-${{ runner.os }}-

      - name: Install Zig
        run: |
          brew install zig
          # libghostty-vt 1.0.x and build.zig assume Zig 0.17.x.
          zig version | grep -q '^0\.17\.' || { echo "Zig 0.17.x is required: $(zig version)"; exit 1; }

      - name: Install Metal Toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Fetch libghostty-vt
        if: steps.ghostty-vt.outputs.cache-hit != 'true'
        run: |
          brew install minisign
          sh scripts/fetch-ghostty-vt.sh

      - name: Test
        run: sh scripts/test.sh

      # Open the real window and photograph the screen, without and with a config file.
      # Only a launch failure or a crash fails here; the pictures are kept to look at, not compared.
      - name: Launch screenshots
        env:
          UPAA_NO_UPDATE_CHECK: "1"
        run: |
          dir=build/screenshots
          mkdir -p "$dir/default/upaa" "$dir/config/upaa"
          printf '%s\n' 'font-size = 16' 'foreground = #cdd6f4' 'background = #1e1e2e' 'window-width = 100' > "$dir/config/upaa/config"
          for name in default config; do
            XDG_CONFIG_HOME="$PWD/$dir/$name" build/upaa.app/Contents/MacOS/upaa &
            pid=$!
            sleep 5
            kill -0 "$pid" || { echo "upaa exited during launch ($name)"; exit 1; }
            screencapture -x "$dir/$name.png"
            kill "$pid"
            wait "$pid" || true
          done

      - name: Keep the launch screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: launch-screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore

      - name: Keep the exported screens
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshots
          path: build/snapshots
