name: review

# Claude reviews a pull request once, when it is opened as ready or a draft is marked ready for review.
# Later pushes are not reviewed again. Pull requests from forks are skipped by the action itself.
# Dependabot's pull requests are skipped too: their workflows cannot read CLAUDE_CODE_OAUTH_TOKEN.
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: anthropics/claude-code-action@v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review --comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as .github/review.md says.
            Post the summary with `gh pr review --comment --body "<summary>" ${{ github.event.pull_request.number }}`.
