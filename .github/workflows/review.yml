name: review

# Claude reviews a pull request once, when it is opened as ready or a draft is marked ready for review.
# Later pushes are not reviewed again. Pull requests from forks are skipped by the action itself.
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: anthropics/claude-code-action@v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to upaa, a terminal emulator for macOS written in Swift and Zig.
            Read CLAUDE.md first and hold the change to its rules, above all the ones on not adding code that is not needed.
            Look for bugs, broken rules from CLAUDE.md, and code that could be removed or simplified. Skip style nitpicks.
            Put each finding on its line with an inline comment. Then leave one short summary with `gh pr comment`,
            saying "No findings" when there are none. Write the comments in Japanese. Do not change any file.
