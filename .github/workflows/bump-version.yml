name: bump-version

# Bumps .version in build.zig.zon and commits it to main. Nothing else changes.
# release.yml calls this after each release with part=patch, so main always holds the next version.
# Run it by hand (gh workflow run bump-version.yml -f part=minor) to move to a new minor or major version.
on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
  workflow_call:
    inputs:
      part:
        type: string
        default: patch

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Bump the version in build.zig.zon
        env:
          PART: ${{ inputs.part }}
        run: |
          current="$(sed -n 's/.*\.version = "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' build.zig.zon)"
          [ -n "$current" ] || { echo "Cannot read the version from build.zig.zon"; exit 1; }
          major="${current%%.*}"; rest="${current#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          case "$PART" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "part must be patch, minor or major: $PART"; exit 1 ;;
          esac
          sed "s/\.version = \"$current\"/.version = \"$next\"/" build.zig.zon > build.zig.zon.new
          mv build.zig.zon.new build.zig.zon
          git diff --exit-code --quiet build.zig.zon && { echo "build.zig.zon did not change"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to $next" build.zig.zon
          git push origin HEAD:main
          echo "$current -> $next"
