name: bump-version

# Bumps .version in build.zig.zon and commits it to main. Nothing else changes.
# main takes only commits that test.yml's lockfile and test checks passed on (the "main PR" ruleset). A push to main
# was refused even with both checks passed on the commit, and a push with the workflow's own token starts no workflow,
# so the commit goes to a branch with a pull request, test.yml is run on it by hand (which that token may do), and the
# pull request is merged once both checks pass. Opening it needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General).
# release.yml calls this after each release with part=patch, so main always holds the next version.
# Run it by hand (gh workflow run bump-version.yml -f part=minor) to move to a new minor or major version.
on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
  workflow_call:
    inputs:
      part:
        type: string
        default: patch

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Bump the version in build.zig.zon
        env:
          PART: ${{ inputs.part }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(sed -n 's/.*\.version = "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' build.zig.zon)"
          [ -n "$current" ] || { echo "Cannot read the version from build.zig.zon"; exit 1; }
          major="${current%%.*}"; rest="${current#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          case "$PART" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "part must be patch, minor or major: $PART"; exit 1 ;;
          esac
          sed "s/\.version = \"$current\"/.version = \"$next\"/" build.zig.zon > build.zig.zon.new
          mv build.zig.zon.new build.zig.zon
          git diff --exit-code --quiet build.zig.zon && { echo "build.zig.zon did not change"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to $next" build.zig.zon
          branch="bump-version/$next"
          git push origin "HEAD:refs/heads/$branch"
          # Deleting the branch closes the pull request; a merged one has already lost its branch.
          trap 'git push origin --delete "$branch" || true' EXIT
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="Bump version to $next" -f head="$branch" \
            -f base=main -f body="Made by bump-version.yml; it merges itself once the tests pass." --jq .number)"
          gh workflow run test.yml --ref "$branch"
          sha="$(git rev-parse HEAD)"
          for check in lockfile test; do
            while :; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=$check" \
                --jq '.check_runs[0] | select(.status == "completed") | .conclusion' || true)"
              [ -n "$result" ] && break
              sleep 30
            done
            [ "$result" = success ] || { echo "$check: $result"; exit 1; }
          done
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=squash -f sha="$sha"
          echo "$current -> $next"
