name: release

# 手で実行する（Actions の画面の「Run workflow」か、gh workflow run release.yml）。
# build.zig.zon の .version を読み、テストを通してからビルドして、v<番号> のタグと Release を作る。
# 同じ番号のタグがすでにあれば失敗する。出すときは、先に build.zig.zon の番号を上げて main に入れておく。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # main 以外からは出さない。
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 30
    permissions:
      # タグと Release を作る
      contents: write
      # ビルドの出どころの証明（attestation）を付ける
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 出すバージョンを決める
        id: version
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          [ -n "$version" ] || { echo "build.zig.zon からバージョンを読めない"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version はすでに出ている。build.zig.zon の番号を上げる"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 配るものは毎回まっさらな状態から作る。テスト用のワークフローのキャッシュは使わない。
      - name: Zig と minisign を入れる
        run: |
          brew install zig minisign
          zig version | grep -q '^0\.17\.' || { echo "Zig 0.17.x が必要: $(zig version)"; exit 1; }

      - name: Metal Toolchain を入れる
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: libghostty-vt を取得する
        run: sh scripts/fetch-ghostty-vt.sh

      - name: テスト（release ビルドもここで作る）
        run: sh scripts/test.sh

      - name: ビルドしたもののバージョンを確かめる
        run: |
          built="$(build/upaa.app/Contents/MacOS/upaa --version)"
          [ "$built" = "${{ steps.version.outputs.version }}" ] || { echo "ビルドしたものは $built で、build.zig.zon の ${{ steps.version.outputs.version }} と違う"; exit 1; }

      - name: 配るファイルを作る
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/upaa.app dist/upaa-macos-arm64.zip
          cd dist && shasum -a 256 upaa-macos-arm64.zip > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/upaa-macos-arm64.zip

      # タグは、このワークフローが動いている commit に付く。
      - name: タグと Release を作る
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/upaa-macos-arm64.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
