name: release

# Run by hand (the "Run workflow" button in Actions, or gh workflow run release.yml).
# Reads .version from build.zig.zon, runs the tests, builds, then creates the v<version> tag and Release.
# Fails if a tag with the same version already exists. To release, first bump the version in build.zig.zon and merge it into main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Do not release from anything other than main.
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 30
    permissions:
      # Create the tag and Release
      contents: write
      # Attach build provenance (attestation)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Determine the version to release
        id: version
        run: |
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          [ -n "$version" ] || { echo "Cannot read the version from build.zig.zon"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released. Bump the version in build.zig.zon"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Build the release artifacts from a clean state every time. Do not use the cache from the test workflow.
      - name: Install Zig and minisign
        run: |
          brew install zig minisign
          zig version | grep -q '^0\.17\.' || { echo "Zig 0.17.x is required: $(zig version)"; exit 1; }

      - name: Install Metal Toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Fetch libghostty-vt
        run: sh scripts/fetch-ghostty-vt.sh

      - name: Test (the release build is also made here)
        run: sh scripts/test.sh

      - name: Check the version of the built app
        run: |
          built="$(build/upaa.app/Contents/MacOS/upaa --version)"
          [ "$built" = "${{ steps.version.outputs.version }}" ] || { echo "The built version is $built, not ${{ steps.version.outputs.version }} from build.zig.zon"; exit 1; }

      - name: Create the files to distribute
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/upaa.app dist/upaa-macos-arm64.zip
          cd dist && shasum -a 256 upaa-macos-arm64.zip > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/upaa-macos-arm64.zip

      # The tag is placed on the commit this workflow runs on.
      - name: Create the tag and Release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/upaa-macos-arm64.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
